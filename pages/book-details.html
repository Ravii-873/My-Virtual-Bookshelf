<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/book-icon.jpg">
  <link rel="stylesheet" href="../css/style.css">
  <title>My Movie Library</title>
</head>

<body>
  <header>
    <div id="logo-title">
      <img src="../assets/images/book-icon.jpg" />
      <h1>My Movie Library</h1>
    </div>

    <button id="add-review">+</button>
  </header>

  <main>
    <div class="details-container">
      <div class="details-review-card">

        <img src="../assets/images/1984.png" />
        <div class="book-info">
          <h2>1984</h2>
          <h3>George Orwell</h3>
          <div class="book-rating">
            <span>★</span>
            <span>★</span>
            <span>★</span>
            <span>★</span>
            <span class="star-empty">★</span>
          </div>
        </div>
      
      </div>
      <div class="review">
        <!-- Date + Review -->
      </div>
    </div>
  </main>

  <footer>
    <ul>
      <li>My Movie Library &copy;</li>
      <li>Developed by Ravi Petry Schwonke, 2026</li>
      <li><a href="https://neps.academy" target="_blank" rel="noopener">Neps Academy</a></li>
    </ul>
  </footer>
</body>

</html>
